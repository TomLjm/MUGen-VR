model:
  hidden_dim: 768
  num_heads: 8
  modality_dropout: 0.2
  reference_tokens: 4

data:
  feature_store: cache/features/msrvtt-real-v1

retrieval:
  top_k: 3

loss:
  temperature: 0.07
  consistency_weight: 0.2
  gate_weight: 0.01

training:
  output_dir: checkpoints/fusion-real-v1
  seed: 42
  batch_size: 32
  eval_batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.01
  max_steps: 2000
  grad_clip: 1.0
  eval_interval: 100
