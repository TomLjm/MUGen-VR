# 融合模块训练配置
model:
  fusion:
    hidden_dim: 768
    num_heads: 8
    num_layers: 4
    dropout: 0.1
    modality_dropout: 0.2
  projector:
    input_dims:
      text: 768
      image: 1024
      audio: 512
      video: 768
    output_dim: 768

training:
  batch_size: 32
  learning_rate: 1e-4
  weight_decay: 0.01
  max_epochs: 50
  warmup_steps: 1000
  grad_clip: 1.0
  mixed_precision: fp16

data:
  num_workers: 4
  pin_memory: true

logging:
  log_interval: 10
  eval_interval: 200
  save_interval: 1000
