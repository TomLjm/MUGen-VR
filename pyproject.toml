[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mugen-vr"
version = "0.1.0"
description = "统一多模态表征下的视频理解、检索与可控生成系统"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jiaming Lin"},
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "einops>=0.6",
    "accelerate>=0.20",
    "transformers>=4.30",
    "opencv-python>=4.7",
    "av>=10.0",
    "pandas>=2.0",
    "pillow>=9.5",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.3",
    "pre-commit>=3.3",
]
internvideo = [
    "timm>=0.9",
    "decord>=0.6",
]
imagebind = [
    "fairscale>=0.4",
]
generation = [
    "diffusers==0.35.1",
    "peft>=0.12",
    "xformers>=0.0.20",
    "open-clip-torch>=2.20",
]
evaluation = [
    "lpips>=0.1",
    "clean-fid>=0.1",
    "pytorch-fid>=0.3",
]
serving = [
    "fastapi>=0.100",
    "uvicorn>=0.22",
    "gradio>=3.40",
    "streamlit>=1.25",
]
data = [
    "yt-dlp>=2026.5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mugen*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py310"]
