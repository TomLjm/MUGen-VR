<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MUGen-VR Evaluation</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211b;
      --muted: #657068;
      --line: #d8ded9;
      --paper: #f7f8f6;
      --panel: #ffffff;
      --green: #147a4b;
      --blue: #2563a7;
      --amber: #9a5b08;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; }
    header { border-bottom: 1px solid var(--line); background: var(--panel); }
    header > div, main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    header > div { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    h1 { margin: 0; font-size: 24px; font-weight: 720; }
    h2 { margin: 0 0 14px; font-size: 18px; }
    p { color: var(--muted); line-height: 1.55; }
    .status { color: var(--green); font-size: 13px; font-weight: 650; text-align: right; }
    main { padding: 24px 0 48px; }
    section { margin-bottom: 30px; }
    .summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
    .metric { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; min-height: 92px; }
    .metric span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 12px; }
    .metric strong { font-size: 20px; font-weight: 700; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
    table { border-collapse: collapse; width: 100%; min-width: 760px; }
    th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
    th { color: var(--muted); font-weight: 650; background: #f0f3f0; }
    tbody tr:last-child td { border-bottom: 0; }
    .cases { display: grid; gap: 18px; }
    .case { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
    .case-head { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    .case-head strong { font-size: 14px; }
    .case-head span { color: var(--muted); font-size: 12px; }
    .videos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .video-label { display: flex; justify-content: space-between; margin-bottom: 7px; font-size: 12px; color: var(--muted); }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #111; border-radius: 4px; }
    .details { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 12px; color: var(--muted); font-size: 12px; }
    .empty { padding: 28px; border: 1px dashed var(--line); color: var(--muted); text-align: center; background: var(--panel); }
    footer { border-top: 1px solid var(--line); padding: 20px 0; color: var(--muted); font-size: 12px; }
    @media (max-width: 820px) {
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .videos, .details { grid-template-columns: 1fr; }
      header > div { align-items: flex-start; padding: 16px 0; flex-direction: column; }
      .status { text-align: left; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>MUGen-VR</h1>
      <div class="status" id="status">Loading evaluation state</div>
    </div>
  </header>
  <main>
    <section>
      <h2>Engineering Smoke</h2>
      <div class="summary" id="summary"></div>
    </section>
    <section>
      <h2>Held-out B0-B3 Metrics</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Variant</th><th>VBench</th><th>Retrieval MRR</th><th>Audio-flow</th><th>Latency</th><th>Peak VRAM</th></tr></thead>
          <tbody id="metrics"></tbody>
        </table>
      </div>
    </section>
    <section>
      <h2>Side-by-side Cases</h2>
      <div class="cases" id="cases"></div>
    </section>
    <footer>MUGen-owned lightweight modules only. AnyFlow, ImageBind, InternVideo2, and MSR-VTT retain upstream licenses.</footer>
  </main>
  <script>
    const fmt = (value, suffix = "") => value == null ? "Pending" : `${Number(value).toFixed(3)}${suffix}`;
    fetch("results.json").then(r => r.json()).then(data => {
      document.getElementById("status").textContent = data.status.replaceAll("-", " ");
      const smoke = data.engineering_smoke;
      const summary = [
        ["Frames", smoke.frames], ["Resolution", smoke.resolution], ["Steps", smoke.steps],
        ["Generation", fmt(smoke.seconds, " s")], ["Peak VRAM", fmt(smoke.peak_vram_gib, " GiB")]
      ];
      document.getElementById("summary").innerHTML = summary.map(([label, value]) =>
        `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`).join("");
      const definitions = {
        B0: "Image + original prompt", B1: "Prompt rewrite", B2: "Fusion without audio/reference", B3: "Full Fusion + audio + reference"
      };
      const byVariant = Object.fromEntries(data.metrics.map(row => [row.variant, row]));
      document.getElementById("metrics").innerHTML = Object.keys(definitions).map(variant => {
        const row = byVariant[variant] || {};
        const retrieval = row.retrieval_mrr == null ? "n/a" : fmt(row.retrieval_mrr);
        return `<tr><td><strong>${variant}</strong><br>${definitions[variant]}</td><td>${fmt(row.vbench_total)}</td><td>${retrieval}</td><td>${fmt(row.onset_flow_correlation)}</td><td>${fmt(row.latency_seconds, " s")}</td><td>${fmt(row.peak_vram_gib, " GiB")}</td></tr>`;
      }).join("");
      const cases = document.getElementById("cases");
      if (!data.cases.length) {
        cases.innerHTML = `<div class="empty">Held-out videos are generated after final B0-B3 training.</div>`;
        return;
      }
      cases.innerHTML = data.cases.map(item => `<article class="case">
        <div class="case-head"><strong>${item.caption}</strong><span>${item.pair_id} · seed ${item.generation_seed}</span></div>
        <div class="videos">
          <div><div class="video-label"><span>B0 baseline</span><span>${fmt(item.b0_seconds, " s")}</span></div><video controls preload="metadata" src="${item.b0_video}"></video></div>
          <div><div class="video-label"><span>B3 full</span><span>${fmt(item.b3_seconds, " s")}</span></div><video controls preload="metadata" src="${item.b3_video}"></video></div>
        </div>
        <div class="details"><span>Top references: ${(item.references || []).join(", ")}</span><span>Gate: ${(item.gates || []).map(v => Number(v).toFixed(2)).join(" / ")}</span><span>${item.note || ""}</span></div>
      </article>`).join("");
    }).catch(error => {
      document.getElementById("status").textContent = `Failed to load results: ${error.message}`;
    });
  </script>
</body>
</html>
